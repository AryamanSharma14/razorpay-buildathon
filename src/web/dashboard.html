<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Decline Recovery Orchestrator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f0f13; color: #e2e2e8; min-height: 100vh; }
  header { background: #1a1a24; border-bottom: 1px solid #2a2a3a; padding: 16px 32px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; font-weight: 600; color: #fff; }
  header .badge { background: #3b82f6; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 12px; }
  .main { padding: 24px 32px; max-width: 1400px; }
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .kpi { background: #1a1a24; border: 1px solid #2a2a3a; border-radius: 10px; padding: 20px; }
  .kpi .label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  .kpi .value { font-size: 28px; font-weight: 700; }
  .kpi .value.green { color: #22c55e; }
  .kpi .value.red { color: #ef4444; }
  .kpi .value.blue { color: #60a5fa; }
  .kpi .value.yellow { color: #f59e0b; }
  .section { background: #1a1a24; border: 1px solid #2a2a3a; border-radius: 10px; padding: 20px; margin-bottom: 24px; }
  .section h2 { font-size: 14px; font-weight: 600; margin-bottom: 16px; color: #a0a0b0; text-transform: uppercase; letter-spacing: .05em; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; padding: 8px 12px; color: #666; font-weight: 500; border-bottom: 1px solid #2a2a3a; }
  td { padding: 10px 12px; border-bottom: 1px solid #1e1e2a; vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .pill.soft { background: #1d4ed8; color: #bfdbfe; }
  .pill.hard { background: #7f1d1d; color: #fca5a5; }
  .pill.recovered { background: #14532d; color: #86efac; }
  .pill.pending { background: #78350f; color: #fde68a; }
  .btn-cancel { background: #3f1d1d; color: #f87171; border: 1px solid #7f1d1d; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
  .btn-cancel:hover { background: #7f1d1d; }
  .feat-list { font-size: 11px; color: #7dd3fc; }
  .reasoning { font-size: 11px; color: #a78bfa; font-style: italic; }
  .channels { display: flex; gap: 12px; flex-wrap: wrap; }
  .ch-bar { background: #1e1e2e; border-radius: 8px; padding: 10px 16px; }
  .ch-bar .ch-name { font-size: 12px; color: #888; }
  .ch-bar .ch-count { font-size: 22px; font-weight: 700; color: #60a5fa; }
  .refresh-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .empty { color: #555; font-size: 13px; padding: 24px; text-align: center; }
  a.link { color: #60a5fa; text-decoration: none; font-size: 12px; }
  a.link:hover { text-decoration: underline; }
</style>
</head>
<body>
<header>
  <div class="refresh-dot" title="Live — polling every 3s"></div>
  <h1>Decline Recovery Orchestrator</h1>
  <span class="badge">LIVE</span>
  <span style="margin-left:auto;font-size:12px;color:#555" id="last-update"></span>
</header>
<div class="main">
  <div class="kpi-row" id="kpi-row">
    <div class="kpi"><div class="label">Recovery Rate</div><div class="value green" id="kpi-rate">—</div></div>
    <div class="kpi"><div class="label">Revenue Recovered</div><div class="value green" id="kpi-revenue">—</div></div>
    <div class="kpi"><div class="label">Soft Declines</div><div class="value blue" id="kpi-soft">—</div></div>
    <div class="kpi"><div class="label">Hard Declines</div><div class="value red" id="kpi-hard">—</div></div>
    <div class="kpi"><div class="label">Pending Retries</div><div class="value yellow" id="kpi-pending">—</div></div>
    <div class="kpi"><div class="label">Recovered</div><div class="value green" id="kpi-recovered">—</div></div>
  </div>

  <div class="section">
    <h2>Channel Breakdown</h2>
    <div class="channels" id="channels"><span class="empty">No nudges sent yet</span></div>
  </div>

  <div class="section">
    <h2>Pending Retries</h2>
    <div id="pending-container">
      <span class="empty">No pending retries</span>
    </div>
  </div>
</div>

<script>
async function load() {
  const resp = await fetch('/dashboard/stats');
  if (!resp.ok) return;
  const d = await resp.json();

  document.getElementById('kpi-rate').textContent = d.recovery_rate_pct + '%';
  document.getElementById('kpi-revenue').textContent = 'INR ' + d.revenue_recovered_inr.toLocaleString('en-IN', {maximumFractionDigits:2});
  document.getElementById('kpi-soft').textContent = d.soft;
  document.getElementById('kpi-hard').textContent = d.hard;
  document.getElementById('kpi-pending').textContent = d.retries_scheduled;
  document.getElementById('kpi-recovered').textContent = d.recovered;
  document.getElementById('last-update').textContent = 'Updated ' + new Date().toLocaleTimeString();

  const ch = document.getElementById('channels');
  const breakdown = d.channel_breakdown || {};
  const keys = Object.keys(breakdown);
  if (keys.length === 0) {
    ch.innerHTML = '<span class="empty">No nudges sent yet</span>';
  } else {
    ch.innerHTML = keys.map(k => `<div class="ch-bar"><div class="ch-name">${k}</div><div class="ch-count">${breakdown[k]}</div></div>`).join('');
  }

  const pc = document.getElementById('pending-container');
  if (!d.pending_retries || d.pending_retries.length === 0) {
    pc.innerHTML = '<span class="empty">No pending retries</span>';
    return;
  }

  const rows = d.pending_retries.map(r => {
    const feats = (r.top_features || []).map(([name, w]) => `${name}(${w})`).join(', ');
    const retryAt = r.retry_at ? new Date(r.retry_at + 'Z').toLocaleString() : '—';
    const linkCell = r.payment_link_url
      ? `<a class="link" href="${r.payment_link_url}" target="_blank">${r.payment_link_url}</a>`
      : '<span style="color:#555">—</span>';
    return `<tr>
      <td><code style="font-size:11px">${r.payment_id}</code></td>
      <td>INR ${r.amount_inr.toLocaleString('en-IN')}</td>
      <td>${retryAt}</td>
      <td><span style="color:#94a3b8;font-size:12px">${r.classify_reason || ''}</span></td>
      <td>${r.confidence != null ? (r.confidence * 100).toFixed(1) + '%' : '—'}</td>
      <td class="feat-list">${feats || '—'}</td>
      <td class="reasoning">${r.nudge_reasoning || '—'}</td>
      <td>${linkCell}</td>
      <td><button class="btn-cancel" onclick="cancel('${r.payment_id}')">Cancel</button></td>
    </tr>`;
  }).join('');

  pc.innerHTML = `<table>
    <thead><tr>
      <th>Payment ID</th><th>Amount</th><th>Retry At</th>
      <th>Decline Reason</th><th>ML Confidence</th>
      <th>Top Features (why this timing)</th>
      <th>Nudge Reasoning (why this message)</th>
      <th>Recovery Link</th><th></th>
    </tr></thead>
    <tbody>${rows}</tbody>
  </table>`;
}

async function cancel(pid) {
  await fetch('/retry/' + pid, { method: 'DELETE' });
  load();
}

load();
setInterval(load, 3000);
</script>
</body>
</html>
